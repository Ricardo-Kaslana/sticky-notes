<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Notes</title>
    <style>
      body {
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        margin: 0;
        overflow: hidden;
        background: #f5f5f5;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="root"><div style="padding:2rem;color:#999;">Loading...</div></div>
    <script>
      window.onerror = function(msg, url, line, col, err) {
        document.getElementById('root').innerHTML =
          '<div style="padding:2rem;color:red;font-size:14px;">' +
          '<b>JS Error:</b><br>' + msg + '<br>' +
          'at ' + url + ':' + line + '<br>' +
          (err && err.stack ? '<pre style="font-size:11px;">' + err.stack + '</pre>' : '') +
          '</div>';
      };
    </script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
