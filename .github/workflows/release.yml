name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Sticky Notes v__VERSION__"
          releaseBody: |
            Windows installers for Sticky Notes v__VERSION__.

            - **Unsigned build:** Windows SmartScreen may warn on first launch.
            - Existing notes are migrated automatically from older app-data directories.
            - See [CHANGELOG.md](https://github.com/Ricardo-Kaslana/sticky-notes/blob/master/CHANGELOG.md) for details.
          releaseDraft: true
          prerelease: false
